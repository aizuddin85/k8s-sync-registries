registries:
  - source_registry: "registry.k8s.io"
    source_repository: "ingress-nginx/controller"
    dest_registry: "registry.apps.aizuddinzali.com:5000"
    dest_repository: "ingress-nginx/controller"
    tag_limit: 3
    insecure_tls: true  # Enable insecure TLS
    exclude_patterns:
      - "alpha"
      - "beta"
      - "rc"
    version_filters:
      - major: 1
        minor: 11
        get_latest: false
      - major: 1
        minor: 10
        get_latest: false
